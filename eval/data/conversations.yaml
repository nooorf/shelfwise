# Conversation set C: scripted sessions with the gold state after every turn.
# Format and scoring: src/shelfwise/evaluation/conversations.py. Constraint lines: eval/PARSING.md.
# Merge rules (what a turn does to the state): src/shelfwise/conversation/merge.py.
#
# constraints: the WHOLE active set after the turn ("same" = unchanged; "~" = not scored,
#   for outcomes that depend on the catalog). "*" as a value: a catalog-dependent number,
#   e.g. what "shorter" resolves to; only the field, op and strength are checked.
# targets: positions (from 1) in the books shown last, for references.
# Drafted by Claude 2026-10-08 (source: llm-draft); several sessions test known gaps on purpose.

today: 2026-10-08

sessions:
  # ---------------------------------------------------------------- refine
  - id: C01
    category: refine
    source: llm-draft
    notes: the design doc's worked example (§17)
    turns:
      - say: give me psychological thrillers
        kind: new_search
        route: search
        constraints:
          - genre in [thriller] soft
        keep: [psychological]
      - say: something darker
        kind: refine
        route: search
        constraints:
          - genre in [thriller] soft
          - facet.darkness gte * soft
        keep: [psychological]
        drop: [darker]
      - say: i dont want anything supernatural
        kind: refine
        constraints:
          - genre in [thriller] soft
          - facet.darkness gte * soft
          - not facet.supernatural eq yes hard
        drop: [supernatural]
      - say: under three hundred pages
        kind: refine
        constraints:
          - genre in [thriller] soft
          - facet.darkness gte * soft
          - not facet.supernatural eq yes hard
          - pages lt 300 hard
      - say: tell me more about the second one
        kind: reference
        route: explain
        constraints: same
        targets: [2]

