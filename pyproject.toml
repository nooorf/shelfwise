[project]
name = "shelfwise"
version = "0.1.0"
description = "Inventory-grounded conversational library search"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx2>=2.13",
    "rapidfuzz>=3.9",
    "bm25s>=0.2",
    "pystemmer>=2.2",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pre-commit>=3.8",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shelfwise"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Line length is the formatter's job; long regex patterns and URLs are fine.
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: needs Postgres and Redis running (make up)",
    "llm: needs Ollama running",
]
